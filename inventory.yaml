# inventory.yaml
# List every device you want the script to touch.
# device_type must be a valid Netmiko driver name:
#   cisco_ios      -> Cisco IOS/IOS-XE switches
#   hp_procurve    -> older HP ProCurve switches
#   aruba_os       -> Aruba/HP ArubaOS-Switch (most current "HP Aruba" switches)
#   aruba_osswitch -> some Netmiko versions use this name instead of aruba_os
#
# No usernames or passwords go in this file - those are supplied at runtime.

devices:
  - name: core-switch-01
    host: 10.5.1.20
    device_type: cisco_ios

  - name: aruba-switch-01
    host: 172.29.129.63
    device_type: aruba_os
